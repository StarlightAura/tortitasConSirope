spring.application.name=TFG
spring.ai.ollama.chat.options.model = qwen3-embedding
spring.ai.model.embedding=qwen3-embedding
server.port = 8087
spring.ai.ollama.base-url=http://127.0.0.1:11434

spring.ai.ollama.init.pull-model-strategy=never




spring.datasource.url=jdbc:mysql://localhost:3307/springboot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_TOKEN_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}