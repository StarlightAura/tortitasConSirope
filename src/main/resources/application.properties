spring.application.name=TFG

spring.ai.ollama.embedding.options.model=qwen3-embedding
server.port=8080
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.init.pull-model-strategy=when_missing

#mongodb
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGO_DB}
spring.ai.vectorstore.mongodb.initialize-schema=true
spring.ai.vectorstore.mongodb.collection-name=GameItem
spring.ai.vectorstore.mongodb.index-name=vector_index
spring.ai.vectorstore.mongodb.num-candidates=150

#PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
