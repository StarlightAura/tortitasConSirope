spring.application.name=TFG

spring.ai.ollama.embedding.options.model=qwen3-embedding
server.port=8080
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL}
spring.ai.ollama.init.pull-model-strategy=when_missing

#mongodb
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGO_DB}
spring.ai.vectorstore.mongodb.initialize-schema=false
spring.ai.vectorstore.mongodb.collection-name=${SPRING_MONGO_COLLECTION_NAME}
spring.ai.vectorstore.mongodb.index-name=${SPRING_MONGO_INDEX_NAME}

#PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
