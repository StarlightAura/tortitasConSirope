spring.application.name=TFG

spring.ai.ollama.embedding.options.model=qwen3-embedding
server.port=8080
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.init.pull-model-strategy=never

#mongodb
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGO_DB}
#PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=${JWT_TOKEN_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}
