    <title>🎪 SIROPE GAMES - DIGITAL CIRCUS 🎪</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Jua&display=swap" rel="stylesheet">
    <style>

            body {
            /* Fondo Amarillo Base de la imagen */
            background-color: #FECE00;

            /*Intento de patron de rombos con colorinchis para que se parezca al circo*/
            background-image:
                    /*Rombos verdes*/
                    linear-gradient(30deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(150deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(30deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(150deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    /*Rombos azules*/
                    linear-gradient(60deg, #0A63F8 25%, transparent 25.5%, transparent 75%, #0A63F8 75.5%, #0A63F8),
                    /*Rombos rojos*/
                    linear-gradient(60deg, #FE3A2F 25%, transparent 25.5%, transparent 75%, #FE3A2F 75.5%, #FE3A2F);

            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;

            min-height: 100vh;/*altura min de toda la pantalla*/
            font-family: var(--font-body);
            color: #fff;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /*nav rollo cartel luminoso*/
        nav {
            background: var(--dc-bg);
            border-bottom: 10px solid;
            border-image: linear-gradient(to right, var(--dc-red), var(--dc-yellow), var(--dc-blue), var(--dc-purple)) 1;
            padding: 15px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        .nav-brand {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--dc-yellow);
            text-shadow: 3px 3px 0 var(--dc-red), -2px -2px 0 var(--dc-blue);
            letter-spacing: 2px;
            animation: glitch 2s infinite;
        }
        .nav-brand span { color: white; }

        .nav-user {
            font-size: 1.1rem;
            color: var(--dc-cyan);
            text-transform: uppercase;
            margin-right: 15px;
            animation: glitch 2s infinite;
        }
        .nav-logout {
            font-family: var(--font-title);
            background: var(--dc-red);
            border: 4px solid white;
            color: white;
            padding: 8px 18px;
            border-radius: 50px; /*Forma de pasti, pedro referencia*/
            cursor: pointer;
            font-size: 1.2rem;
            text-decoration: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .nav-logout:hover {
            transform: scale(1.1);
            background: var(--dc-blue);
            box-shadow: 0 0 15px var(--dc-cyan);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            font-family: var(--font-title);
            font-size: 2rem;
            color: white;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0 var(--dc-purple);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /*Tarjetas tipo 3d semi trans*/
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(7px);
            border: 8px solid white;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 40px;
            /* Efecto semi trans*/
            box-shadow:
                    10px 10px 0px rgba(0,0,0,0.3),
                    inset 5px 5px 10px rgba(255,255,255,0.2),
                    inset -5px -5px 10px rgba(0,0,0,0.2);
            position: relative;
        }

        /*Decoracion de esquina en tarjetas*/
        .card::after {
            content: '♚'; /*kinger my beloved*/
            position: absolute;
            top: -20px;
            right: -20px;
            background: var(--dc-yellow);
            color: black;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
        }

        /* Animación suave para la primera tarjeta (búsqueda) */
        .card-search {
            /*animation: floatY 4s ease-in-out infinite;*/
        }

        /*decoration para las posibles alerts*/
        .alert {
            font-family: var(--font-title);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            border: 4px solid white;
            text-transform: uppercase;
        }
        .alert-error {
            background: var(--dc-red);
            color: white;
            box-shadow: 0 0 20px var(--dc-red);
            animation: shake 0.3s infinite;
        }
        .alert-success {
            background: var(--dc-cyan);
            color: black;
            box-shadow: 0 0 20px var(--dc-cyan);
        }

        /*inputs y botones con estilo de juguetes ma o meno*/
        .search-row {
            display: flex;
            gap: 15px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            background: var(--dc-yellow);
            border: 5px solid white;
            border-radius: 50px;
            padding: 15px 20px;
            color: black;
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            box-shadow: inset 3px 3px 5px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        textarea { border-radius: 20px; resize: vertical; }

        input:focus, textarea:focus {
            background: white;
            border-color: var(--dc-cyan);
            box-shadow: 0 0 15px var(--dc-cyan);
        }

        /*Botones super 3D*/
        .btn {
            font-family: var(--font-title);
            padding: 15px 30px;
            border-radius: 50px;
            border: 5px solid white;
            font-size: 1.4rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            position: relative;
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        /* Botón Primario (Rojo pomni) */
        .btn-primary {
            background: var(--dc-red);
            box-shadow: 0 8px 0 #990026, 0 8px 10px rgba(0,0,0,0.5);
        }
        .btn-primary:hover { background: #ff3366; }

        /* Botón Secundario (Azul reemplazo de caine) */
        .btn-secondary {
            background: var(--dc-blue);
            box-shadow: 0 8px 0 #003399, 0 8px 10px rgba(0,0,0,0.5);
        }
        .btn-secondary:hover { background: #3377ff; }

        /*Efecto de presionar boton*/
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #990026, 0 4px 6px rgba(0,0,0,0.5);
        }
        .btn-secondary:active { box-shadow: 0 4px 0 #003399, 0 4px 6px rgba(0,0,0,0.5); }

        /*resultados mal renderizados*/
        .results-header {
            font-size: 1.1rem;
            color: var(--dc-cyan);
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .result-item {
            background: var(--dc-purple);
            border: 4px solid var(--dc-yellow);
            color: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .result-item:hover {
            transform: scale(1.03) rotate(1deg);
            background: white;
            color: black;
            border-color: var(--dc-red);
        }

        /*forms y grid*/
        #insert-form {
            display: none;
            margin-top: 25px;
            border-top: 5px dashed white;
            padding-top: 25px;
        }
        #insert-form.visible { display: block; animation: expandDown 0.5s ease; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-full { margin-bottom: 15px; }

        /*animaciones*/
        @keyframes glitch {
            0% { text-shadow: 3px 3px 0 var(--dc-red), -2px -2px 0 var(--dc-blue); }
            14% { text-shadow: 3px 3px 0 var(--dc-red), -2px -2px 0 var(--dc-blue); }
            15% { text-shadow: -5px -5px 0 var(--dc-red), 5px 5px 0 var(--dc-blue); }
            16% { text-shadow: 3px 3px 0 var(--dc-red), -2px -2px 0 var(--dc-blue); }
            100% { text-shadow: 3px 3px 0 var(--dc-red), -2px -2px 0 var(--dc-blue); }
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        @keyframes expandDown {
            0% { opacity: 0; transform: translateY(-20px) scaleY(0); }
            100% { opacity: 1; transform: translateY(0) scaleY(1); }
        }

    </style>
</head>
<body>

<nav>
    <div class="nav-brand">🎪 <span>DIGITAL</span> PANCAKES 🥞</div>
    <div style="display:flex; align-items:center;">
        <span class="nav-user" th:text="'Sujeto: ' + ${username}">Sujeto: Pomni</span>
        <a href="/web/logout" class="nav-logout">¡ABSTRAERSE!</a>
    </div>
</nav>

<div class="container">

    <p class="section-title">🔍 <span style="color:var(--dc-cyan)">Explorar</span> el Vacío</p>
    <div class="card card-search">
        <form action="/web/recommendations" method="get" class="search-row">
            <input type="text" name="product"
                   th:value="${query}"
                   placeholder="Introduce tu proxima aventura (ej: aventura de chuches)"
                   required/>
            <button type="submit" class="btn btn-primary">¡GENERAR!</button>
        </form>

        <div th:if="${recomendaciones}" style="margin-top: 25px;">
            <p class="results-header">Tus próximas aventuras:</p>
            <div th:each="rec : ${recomendaciones}" class="result-item"
                 th:text="${rec}">
                Muestra de Juego Digital #1
            </div>
        </div>
    </div>

    <p class="section-title">➕ <span style="color:var(--dc-red)">Añadir</span> Nuevo Integrante</p>
    <div class="card">

        <div th:if="${errorInsert}" class="alert alert-error">⚠️¡ERROR!⚠️</div>
        <div th:if="${successInsert}" class="alert alert-success">✅¡COMPLETADO!✅</div>

        <button class="btn btn-secondary"
                style="width: 100%;"
                onclick="document.getElementById('insert-form').classList.toggle('visible')">
            --- ABRIR PANEL DE CONTROL ---
        </button>

        <div id="insert-form">
            <form action="/web/products" method="post">

                <div class="form-grid">
                    <input type="number" name="sid" placeholder="ID Digital (sid) *" required/>
                    <input type="text"   name="name" placeholder="Nombre del juego *" required/>
                </div>

                <div class="form-grid">
                    <input type="text" name="genres" placeholder="Género (RPG, Caos…)"/>
                    <input type="text" name="tags" placeholder="Etiquetas (Miedo, Risa…)"/>
                </div>

                <div class="form-full">
                    <textarea name="description"
                              placeholder="Describe la aventura del juego..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top:15px; width:100%; background:var(--dc-purple); box-shadow: 0 8px 0 #6600cc;">
                    CONVERTIR EN INTEGRANTE DE SIROPE GAMES
                </button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
