        body {
            background-color: #FECE00;
            background-image:
                    linear-gradient(30deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(150deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(30deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(150deg, #3DCC3A 12%, transparent 12.5%, transparent 87%, #3DCC3A 87.5%, #3DCC3A),
                    linear-gradient(60deg, #0A63F8 25%, transparent 25.5%, transparent 75%, #0A63F8 75.5%, #0A63F8),
                    linear-gradient(60deg, #FE3A2F 25%, transparent 25.5%, transparent 75%, #FE3A2F 75.5%, #FE3A2F);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-body);
            padding: 20px;
        }

        /*tarjeta del login*/
        .card {
            background: rgba(0, 17, 51, 0.9);
            backdrop-filter: blur(10px);
            border: 8px solid white;
            border-radius: 40px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
            animation: floatY 4s ease-in-out infinite;
        }

        .card::before {
            content: '🎭';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            filter: drop-shadow(0 5px 0 rgba(0,0,0,0.3));
        }

        h1 {
            font-family: var(--font-title);
            font-size: 3rem;
            color: var(--dc-yellow);
            text-shadow: 4px 4px 0 var(--dc-red), -2px -2px 0 var(--dc-blue);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--dc-cyan);
            text-transform: uppercase;
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /*alertas*/
        .alert {
            font-family: var(--font-title);
            padding: 12px;
            border-radius: 15px;
            border: 3px solid white;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .alert-error {
            background: var(--dc-red);
            color: white;
            animation: shake 0.3s infinite;
        }
        .alert-success {
            background: var(--dc-cyan);
            color: black;
        }

        /*form*/
        label {
            display: block;
            text-align: left;
            margin-left: 20px;
            margin-bottom: 5px;
            color: white;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--dc-yellow);
            border: 5px solid white;
            border-radius: 50px;
            padding: 15px 20px;
            color: black;
            font-family: var(--font-body);
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
            box-shadow: inset 3px 3px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        input:focus {
            background: white;
            transform: scale(1.02);
            border-color: var(--dc-cyan);
        }

        /*botones*/
        .btn {
            font-family: var(--font-title);
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: 5px solid white;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .btn-primary {
            background: var(--dc-red);
            box-shadow: 0 8px 0 #990026;
        }

        .btn-secondary {
            background: var(--dc-purple);
            box-shadow: 0 8px 0 #6600cc;
            font-size: 1.2rem;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
        }

        .divider {
            margin: 20px 0;
            color: var(--dc-cyan);
            font-family: var(--font-title);
            font-size: 1.2rem;
            position: relative;
        }

        /*animaciones*/
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            0% { transform: translateX(2px); }
            50% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }

    </style>
</head>
<body>

<div class="card">
    <h1>SIROPE GAMES</h1>
    <p class="subtitle">¡No te abstraigas todavía!</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}">ERROR EXISTENCIAL</div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}">ENTRADA CONCEDIDA</div>

    <form action="/web/signin" method="post">
        <label>Sujeto</label>
        <input type="text" name="nombreUser" placeholder="Nombre de usuario..." required/>

        <label>Código Secreto</label>
        <input type="password" name="password" placeholder="Contraseña..." required/>

        <button type="submit" class="btn btn-primary">¡ENTRAR AL SHOW!</button>
    </form>

    <div class="divider">--- ¿NUEVA ENTIDAD? ---</div>

    <form action="/web/signup" method="post">
        <div style="display: flex; gap: 10px;">
            <input type="text" name="nombreUser" placeholder="Usuario" required/>
            <input type="password" name="password" placeholder="Clave" required/>
        </div>
        <button type="submit" class="btn btn-secondary">REGISTRAR EN EL SISTEMA</button>
    </form>
</div>

</body>
</html>
