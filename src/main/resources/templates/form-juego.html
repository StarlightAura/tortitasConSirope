<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Panel de Control - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Añadir Nuevo Juego (Vectorización Automática)</h2>
<hr>

<form th:action="@{/api/products}" method="post" th:object="${juego}">
    <div class="mb-3">
        <label class="form-label">Nombre del Juego</label>
        <input type="text" th:field="*{nombre}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción Detallada</label>
        <textarea th:field="*{descripcion}" class="form-control" rows="4"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar y Vectorizar</button>
    <a href="/web/juegos" class="btn btn-secondary">Volver al catálogo</a>
</form>
</body>
</html>
